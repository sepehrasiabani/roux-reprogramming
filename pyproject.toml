[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "roux-reprogramming"
version = "0.1.0"
description = "GRN reanalysis of a pooled Yamanaka-factor screen in mouse MSCs"
requires-python = ">=3.10"
dependencies = [
    "numpy==1.26.4",
    "pandas>=2.0",
    "scanpy>=1.9",
    "anndata>=0.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
